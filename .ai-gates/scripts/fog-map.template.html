<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>迷雾地图</title>
<style>
:root { --bg:#1a2420; --ink:#e8e0c8; --muted:#9aa392; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",sans-serif;overflow:hidden}
#top{position:fixed;top:0;left:0;right:280px;height:48px;display:flex;gap:8px;align-items:center;padding:8px 12px;background:#121a18;border-bottom:1px solid #314038;z-index:5}
#top input{flex:1;max-width:360px;background:#0e1412;color:var(--ink);border:1px solid #3a4a40;padding:6px 10px}
#back{display:none;background:#314038;color:var(--ink);border:0;padding:6px 10px;cursor:pointer}
#hint{color:var(--muted);font-size:12px}
#side{position:fixed;top:0;right:0;width:280px;bottom:0;background:#121a18;border-left:1px solid #314038;padding:12px;overflow:auto;z-index:5}
#side h2{margin:0 0 8px;font-size:15px}
#side .meta{color:var(--muted);font-size:12px;margin-bottom:8px}
#worldWrap{position:absolute;inset:48px 280px 0 0;overflow:hidden;cursor:grab;background:radial-gradient(ellipse at 40% 30%, #243028 0%, #1a2420 55%, #121a16 100%)}
#world{position:absolute;transform-origin:0 0}
svg.roads{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}
svg.trend-layer{z-index:1;pointer-events:none}
svg.roads g.relg{pointer-events:none}
svg.roads g.relg line.hit{pointer-events:stroke;stroke:rgba(0,0,0,0);stroke-width:16;fill:none}
svg.roads g.relg line.rel{pointer-events:none;opacity:.5;stroke:#6a5a32;stroke-width:1.25;stroke-dasharray:5 6}
svg.roads g.relg.hi line.rel,svg.roads line.rel.hi{opacity:.88;stroke:#8a7340;stroke-width:1.7;stroke-dasharray:5 6}
svg.roads g.relg:hover line.rel{stroke:#9a8450;stroke-width:1.7;opacity:.8}
svg.roads .fogrel{stroke:#d4c48a;stroke-width:2;stroke-dasharray:5 6;opacity:.72;pointer-events:none;fill:none}
svg.roads .landrel{stroke:#d4c48a;stroke-width:2.1;stroke-dasharray:6 7;opacity:.72;pointer-events:stroke;fill:none}
#world.ow-hi svg.roads .landrel,#world.ow-hi svg.roads .fogrel{opacity:.12}
#world.ow-hi svg.roads .landrel.hi,#world.ow-hi svg.roads .fogrel.hi{opacity:1;stroke:#e8d4a0;stroke-width:3.2}
svg.roads line.trail{fill:none;stroke:#b4c89a;stroke-width:2.6;opacity:.5;pointer-events:none}
svg.roads g.trendg line.trend{fill:none;stroke:#e4f2cc;stroke-width:4;opacity:0;pointer-events:none}
#world.focus-on .tile{opacity:.2;filter:saturate(.25);pointer-events:auto}
#world.focus-on .tile.is-sel{opacity:1;filter:none;z-index:12;box-shadow:0 0 0 3px #f2e6a6,0 4px 0 #0b100e}
#world.focus-on .tile.is-nb{opacity:.5;filter:none;z-index:10;box-shadow:0 0 0 2px #c4a35a66,0 4px 0 #0b100e}
#world.focus-on .tile.is-trend{opacity:1;filter:none;z-index:11;box-shadow:0 0 0 2px #c5d4b0,0 4px 0 #0b100e}
#world.focus-on .tile.fog{opacity:.12}
#world.focus-on .tile.fog.is-sel,#world.focus-on .tile.fog.is-nb,#world.focus-on .tile.fog.is-trend{opacity:.75}
#world.focus-on svg.roads g.relg line.rel, #world.focus-on svg.roads line.rel{opacity:.08;stroke-width:1}
#world.focus-on svg.roads g.relg.hi line.rel, #world.focus-on svg.roads line.rel.hi{opacity:.88;stroke:#8a7340;stroke-width:1.7}
#world.focus-on svg.roads g.relg:not(.hi) line.hit{pointer-events:none}
#world.focus-on svg.roads line.trail{opacity:.12}
#world.focus-on svg.roads g.trendg line.trend{opacity:1}
.land{position:absolute;z-index:10;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 14px 16px;color:var(--ink);border:3px solid #2c3830;border-radius:36px;box-shadow:0 4px 0 #0b100e, inset 0 0 18px #0004}
.land.has-fog{box-shadow:0 4px 0 #0b100e, inset 0 0 22px #5eead466, inset 0 0 48px #5eead4aa, inset 0 0 12px #5eead4}
.land:hover{filter:brightness(1.12)}
.land .ln{font-size:13px;line-height:1.3;width:100%;padding:0 2px;overflow:hidden;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.land .lm{font-size:11px;color:var(--muted);margin-top:6px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile{position:absolute;width:120px;height:120px;border:3px solid #2c3830;border-radius:36px;padding:8px 8px 36px;font-size:11px;line-height:1.2;cursor:pointer;box-shadow:0 4px 0 #0b100e, inset 0 0 18px #0004;z-index:10}
.tile .ord{position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;background:#c4a35a;color:#1a1810;font-size:11px;font-weight:700;line-height:22px;text-align:center;z-index:3}
.tile .name{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;padding:0 2px}
.tile .when{position:absolute;left:6px;right:6px;bottom:22px;font-size:10px;color:#b8c4a8;z-index:2;pointer-events:none}
.s-doing{background:#5a4214;border-color:#f0c040}
.s-done{background:#145a38;border-color:#3dcc7a}
.s-pause{background:#143a52;border-color:#4ec4e8}
.s-fail{background:#6a2218;border-color:#ff6b5a}
.s-layer{background:#3e1e68;border-color:#c080ff}
.tile.island{outline:2px dashed #8a7a50}
.tile.fog{background:#2a3330;opacity:.45;border-style:dashed}
.land.nation{border-style:dashed;border-width:3px;background:#243038}
.land.sat{z-index:12;padding:10px 12px}
.land .land-badges{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:4px;max-width:100%}
.land .land-badges .badge-cov,.land .land-badges .badge-hot,.land .land-badges .badge-fog{display:inline-block;padding:1px 5px;border-radius:8px;font-size:9px;border:1px solid #3a4a40;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.land .land-badges .badge-cov{background:#1e3a32;color:#9ad4b8}
.land .land-badges .badge-hot{background:#3a2a18;color:#e0b070}
.land .land-badges .badge-fog{background:#2a5a52;color:#99f6e4;border-color:#f0c040;font-weight:800;font-size:10px;padding:2px 6px;box-shadow:inset 0 0 10px #5eead4aa,0 0 6px #5eead466}
.tile.flash{box-shadow:0 0 0 3px #f2e6a6}
.flag{position:absolute;top:-10px;right:4px;color:#f2e6a6}
.pins{position:absolute;left:4px;right:4px;bottom:3px;display:flex;gap:3px;flex-wrap:wrap;padding:0;justify-content:center;z-index:3}
.pin{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid #111;cursor:pointer;font-size:0;line-height:0;color:transparent}
.pin.doc{background:#d4c48a}.pin.dispatch{background:#5b8fd4}
.pin.report{background:#6cbf7a}.pin.board{background:#d45b5b}
.pin.lesson{background:#e09a3a}.pin.other{background:#888}
#legend{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.7}
#legend .badge-cov,#legend .badge-hot,#legend .badge-fog{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid #3a4a40}
#legend .badge-cov{background:#1e3a32;color:#9ad4b8}
#legend .badge-hot{background:#3a2a18;color:#e0b070}
#legend .badge-fog{background:#2a5a52;color:#99f6e4;border-color:#f0c040;font-weight:800;box-shadow:inset 0 0 10px #5eead4aa,0 0 6px #5eead466}
.card-badge{display:inline-block;margin:0 6px 6px 0;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid #3a4a40}
.card-badge.cov{background:#1e3a32;color:#9ad4b8}
.card-badge.hot{background:#3a2a18;color:#e0b070}
.card-badge.fog{background:#2a5a52;color:#99f6e4;border-color:#f0c040;font-weight:800;box-shadow:inset 0 0 10px #5eead4aa,0 0 6px #5eead466}
#minimap{position:absolute;left:10px;bottom:10px;z-index:7;max-width:240px;max-height:42%;overflow:auto;background:#0e1412f2;border:1px solid #3a4a40;border-radius:8px;padding:8px;pointer-events:auto;box-shadow:0 4px 12px #0008}
#minimap .mm-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin:0 0 6px}
#minimap .mm-x{flex:0 0 auto;width:20px;height:20px;padding:0;border:1px solid #3a4a40;border-radius:4px;background:#1a2220;color:#e8e0c8;font-size:14px;line-height:18px;cursor:pointer}
#minimap .mm-x:hover{border-color:#c4a35a;color:#f2e6a6}
#minimap.mm-hidden{display:none}
#mmOpen{display:none;position:absolute;left:10px;bottom:10px;z-index:7;padding:4px 10px;border:1px solid #3a4a40;border-radius:8px;background:#0e1412f2;color:#e8e0c8;font-size:11px;cursor:pointer;pointer-events:auto;box-shadow:0 4px 12px #0008;font-family:inherit}
#mmOpen.show{display:inline-block}
#mmOpen:hover{border-color:#c4a35a;filter:brightness(1.12)}
#minimap .mm-list{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
#minimap .mm-chip{display:inline-flex;align-items:center;gap:4px;margin:0;padding:3px 7px;border-radius:8px;border:1px solid #3a3a36;background:#1a2220;color:#e8e0c8;font-size:11px;cursor:pointer;max-width:100%;font-family:inherit}
#minimap .mm-chip:hover{filter:brightness(1.12);border-color:#c4a35a}
#minimap .mm-chip .mm-tag{color:#5eead4;font-weight:800}
#minimap .mm-chip .mm-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
#minimap .mm-empty{font-size:11px;color:var(--muted)}
svg.roads g.nearg line.nearln{pointer-events:none;opacity:.32;stroke:#6a7a68;stroke-width:1.1;stroke-dasharray:2 8}
svg.roads g.nearg line.hit{pointer-events:stroke;stroke:rgba(0,0,0,0);stroke-width:16;fill:none}
#legend .lg{display:flex;align-items:center;gap:6px}
#legend .lg span.s-doing,#legend .lg span.s-done,#legend .lg span.s-pause,#legend .lg span.s-fail,#legend .lg span.s-layer{display:inline-block;width:16px;height:16px;border:3px solid;border-radius:4px;flex:0 0 16px}
#reader{display:none;position:fixed;left:12px;right:292px;top:60px;bottom:12px;background:#0e1412;border:1px solid #3a4a40;padding:16px;overflow:auto;z-index:8;white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px}
#reader.show{display:block}
#reader .close{position:sticky;top:0;float:right;background:#314038;color:var(--ink);border:0;padding:4px 8px;cursor:pointer}
#tip{display:none;position:fixed;z-index:9;max-width:260px;padding:8px 10px;background:#0e1412;border:1px solid #c4a35a;border-radius:8px;color:var(--ink);font-size:12px;line-height:1.35;pointer-events:none;box-shadow:0 6px 16px #000a;white-space:normal}
#tip.show{display:block}
#tip b{display:block;margin-bottom:4px;color:#f2e6a6}
</style>
</head>
<body>
<div id="top">
  <button type="button" id="back">返回大地图</button>
  <strong>迷雾地图</strong>
  <input id="q" type="search" placeholder="search id / state"/>
  <span id="hint"></span>
</div>
<aside id="side">
  <p class="meta">按网络拓扑分簇：有岛的大陆是枢纽，岛在右。雾在小地图，大地图块上用雾徽章。沟里的虚线合成总线，横平竖直各画一遍，不叠线。</p>
  <div id="legend">
    <div class="lg"><span class="badge-cov" id="legendCov">覆盖度:无</span></div>
    <div class="lg"><span class="badge-hot" id="legendHot">热度:无</span></div>
    <div class="lg"><span class="badge-fog" id="legendFog">雾:未建夹</span></div>
    <div class="lg"><span class="s-doing"></span> 执行中</div>
    <div class="lg"><span class="s-done"></span> 签收</div>
    <div class="lg"><span class="s-pause"></span> 停写</div>
    <div class="lg"><span class="s-fail"></span> 失败</div>
    <div class="lg"><span class="s-layer"></span> 换层</div>
    <div class="lg"><span class="pin doc"></span> 方案正文（未完成 / 物理口径 / Mandatory）</div>
    <div class="lg"><span class="pin dispatch"></span> 派发 / 方案审</div>
    <div class="lg"><span class="pin report"></span> 实现 / 代码审核</div>
    <div class="lg"><span class="pin board"></span> 修复黑板</div>
    <div class="lg"><span class="pin lesson"></span> 错题 / 教训</div>
    <div class="lg"><span class="pin other"></span> 其他证据</div>
  </div>
  <div id="card">-</div>
</aside>
<div id="worldWrap"><div id="world"><svg class="roads" id="roads"></svg><svg class="roads trend-layer" id="trendLayer"></svg></div><div id="minimap"><div class="mm-h"><span>未建夹</span><button type="button" class="mm-x" id="mmClose" title="关闭">×</button></div><div class="mm-list" id="minimapList"></div></div><button type="button" id="mmOpen">未建夹</button></div>
<div id="reader"><button class="close" id="closeReader">close</button><div id="readerBody"></div></div>
<div id="tip"></div>
<script>
const DATA = __DATA__;
if (!Array.isArray(DATA.nodes)) DATA.nodes = DATA.nodes ? [DATA.nodes] : [];
if (!Array.isArray(DATA.edges)) DATA.edges = DATA.edges ? [DATA.edges] : [];
if (!Array.isArray(DATA.near)) DATA.near = DATA.near ? [DATA.near] : [];
if (!Array.isArray(DATA.fog)) DATA.fog = DATA.fog ? [DATA.fog] : [];
function covLabel(n){
  if(n && n.coverage) return "覆盖度:"+n.coverage;
  return "覆盖度:无";
}
function hotLabel(n){
  if(n && n.heatBand) return "热度:"+n.heatBand;
  return "热度:无";
}
function pickMemberField(g, key){
  const mem=(g && g.members)||[];
  for(let i=0;i<mem.length;i++){
    const v=mem[i][key];
    if(v) return v;
  }
  return null;
}
function groupCovLabel(g){
  const v=pickMemberField(g,"coverage");
  return v ? "覆盖度:"+v : "覆盖度:无";
}
function groupHotLabel(g){
  const v=pickMemberField(g,"heatBand");
  return v ? "热度:"+v : "热度:无";
}
function groupFogCount(g){
  let n=0;
  fogNodes.forEach(function(fn){
    if(fn._home===g || (fn._lands||[]).indexOf(g)>=0) n++;
  });
  return n;
}
function groupFogLabel(g){
  const n=groupFogCount(g);
  if(n<=0) return "";
  return "雾:"+n;
}
function groupBadgeHtml(g){
  let html="<p><span class='card-badge cov'>"+groupCovLabel(g)+"</span><span class='card-badge hot'>"+groupHotLabel(g)+"</span>";
  const fog=groupFogLabel(g);
  if(fog) html+="<span class='card-badge fog'>"+fog+"</span>";
  return html+"</p>";
}
function landStatus(g){
  if(g.fogland) return "未建夹，可能前进方向";
  if(g.nation) return (g.n||0)+" 座岛 · 无大陆关系";
  if(g.isolate) return "落单岛 · 连 "+(g._home?landTitle(g._home):"大陆");
  return (g.n||0)+" 格";
}
function edgePartsTip(e){
  const parts=(e.parts||[]).join(", ");
  return parts+" ; score "+e.score;
}
function nearHoverTip(e){
  const have=(e.parts||[]).join(", ")||"(none)";
  const keys=["rel","body","cs","evidence"];
  const joined=(e.parts||[]).join(" ").toLowerCase();
  const miss=keys.filter(function(k){ return joined.indexOf(k)<0; }).join("/");
  const gap=3-(e.score||0);
  return "差 "+gap+" 分过阈；已有 "+have+"；缺 "+(miss||"无");
}
(function initLegendBadges(){
  const cov=document.getElementById("legendCov");
  const hot=document.getElementById("legendHot");
  if(cov) cov.textContent = DATA.coverageSrc ? "覆盖度:coverage-map.yaml" : "覆盖度:无";
  if(hot) hot.textContent = DATA.heatSrc ? "热度:regression-heat.yaml" : "热度:无";
})();
const wrap=document.getElementById("worldWrap");
const world=document.getElementById("world");
const roads=document.getElementById("roads");
const trendLayer=document.getElementById("trendLayer");
const card=document.getElementById("card");
const hint=document.getElementById("hint");
const reader=document.getElementById("reader");
const readerBody=document.getElementById("readerBody");
const backBtn=document.getElementById("back");
const tipBox=document.getElementById("tip");
function hideMapTip(){
  if(tipBox) tipBox.classList.remove("show");
}
function moveMapTip(ev){
  if(!tipBox || !tipBox.classList.contains("show") || !ev) return;
  let x=ev.clientX+14, y=ev.clientY+18;
  const w=tipBox.offsetWidth||160, h=tipBox.offsetHeight||40;
  if(x+w>window.innerWidth-8) x=ev.clientX-w-12;
  if(y+h>window.innerHeight-8) y=ev.clientY-h-12;
  if(x<4) x=4;
  if(y<4) y=4;
  tipBox.style.left=x+"px";
  tipBox.style.top=y+"px";
}
function showMapTip(title, status, ev){
  if(!tipBox) return;
  tipBox.textContent="";
  const b=document.createElement("b");
  b.textContent=title||"";
  tipBox.appendChild(b);
  if(status){
    const s=document.createElement("span");
    s.textContent=status;
    tipBox.appendChild(s);
  }
  tipBox.classList.add("show");
  moveMapTip(ev);
}
const TILE=120;
let scale=1, tx=40, ty=40, drag=false, lx=0, ly=0, view="world";
let focusId=null, dragMoved=false, localGroup=null, lastCx=null, lastCy=null, trendEl=null;
const PIN_UI={
  doc:{ch:"文", tip:"方案正文：未完成.md、物理口径、Mandatory 步骤"},
  dispatch:{ch:"派", tip:"派发或方案审核记录"},
  report:{ch:"码", tip:"实现或代码审核记录"},
  board:{ch:"板", tip:"修复黑板 / 现场记录"},
  lesson:{ch:"错", tip:"错题 / 教训"},
  other:{ch:"证", tip:"其他证据文件"}
};
function apply(){ world.style.transform="translate("+tx+"px,"+ty+"px) scale("+scale+")"; }
function centerOn(cx, cy, sc){
  lastCx=cx; lastCy=cy;
  if(sc!=null) scale=sc;
  function go(){
    const r=wrap.getBoundingClientRect();
    const vw=r.width||800, vh=r.height||600;
    tx=vw/2-cx*scale;
    ty=vh/2-cy*scale;
    apply();
  }
  go();
  requestAnimationFrame(go);
}
window.addEventListener("resize", function(){ if(lastCx!=null) centerOn(lastCx, lastCy); });
wrap.addEventListener("mousedown", function(e){
  if(e.target.closest(".pin")||e.target.closest(".tile")||e.target.closest(".land")||e.target.closest("#minimap")||e.target.closest("#mmOpen")) return;
  drag=true; dragMoved=false; lx=e.clientX; ly=e.clientY; wrap.style.cursor="grabbing";
});
window.addEventListener("mouseup", function(){ drag=false; wrap.style.cursor="grab"; });
window.addEventListener("mousemove", function(e){
  if(!drag) return;
  const dx=e.clientX-lx, dy=e.clientY-ly;
  if(Math.abs(dx)+Math.abs(dy)>6) dragMoved=true;
  tx+=dx; ty+=dy; lx=e.clientX; ly=e.clientY; apply();
});
wrap.addEventListener("click", function(e){
  if(view!=="local" || dragMoved) return;
  if(e.target.closest(".tile")||e.target.closest(".pin")||e.target.closest(".land")||e.target.closest("#minimap")||e.target.closest("#mmOpen")) return;
  clearFocus();
  if(localGroup) showGroupCard(localGroup);
});
wrap.addEventListener("wheel", function(e){
  if(e.target.closest("#minimap")||e.target.closest("#mmOpen")) return;
  e.preventDefault();
  const k=e.deltaY>0?0.92:1.08;
  const next=Math.min(2.8, Math.max(0.22, scale*k));
  const r=wrap.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const wx=(mx-tx)/scale, wy=(my-ty)/scale;
  scale=next; tx=mx-wx*scale; ty=my-wy*scale; apply();
}, {passive:false});
const nodes=DATA.nodes.map(function(n){
  if (!Array.isArray(n.pins)) n.pins = n.pins ? [n.pins] : [];
  const rels = n.rels || n.rel || [];
  n.rel = Array.isArray(rels) ? rels : (rels ? [rels] : []);
  n.t = n.discovered || n.t || 0;
  return Object.assign({}, n, { x:0, y:0 });
});
const byId={}; nodes.forEach(function(n){ byId[n.id]=n; });
DATA.fog.forEach(function(id){
  if(byId[id]) return;
  const n={id:id, state:"fog", cls:"fog", island:true, rec:null, evCount:0, preview:null, pins:[], rel:[], t:2147483647, fog:true, x:0, y:0};
  nodes.push(n); byId[id]=n;
});
function familyOf(id){
  if(!id) return id;
  const slice=id.indexOf("-切片");
  if(slice>0) return id.slice(0,slice)+"·切片";
  const hot=id.indexOf("-热修");
  if(hot>0) return id.slice(0,hot)+"·热修";
  const rm=id.match(/^(.*)-R[0-9]+[a-z]?$/);
  if(rm && rm[1].length>=4) return rm[1];

  hint.textContent=landTitle(g)+" · "+g.n+" 格 · 实线箭头=走势 · 暗金虚线=关系路";
  showGroupCard(g);
  centerOn((minX+maxX+TILE)/2, (minY+maxY+TILE)/2, 1);
}
backBtn.onclick=function(){ showOverworld(); };
(function initMinimapToggle(){
  const mm=document.getElementById("minimap");
  const mmClose=document.getElementById("mmClose");
  const mmOpen=document.getElementById("mmOpen");
  if(!mm || !mmClose || !mmOpen) return;
  mmClose.onclick=function(ev){
    ev.stopPropagation();
    hideMapTip();
    mm.classList.add("mm-hidden");
    mmOpen.classList.add("show");
  };
  mmOpen.onclick=function(ev){
    ev.stopPropagation();
    mm.classList.remove("mm-hidden");
    mmOpen.classList.remove("show");
  };
})();
document.getElementById("closeReader").onclick=function(){ reader.classList.remove("show"); };
document.getElementById("q").addEventListener("input", function(e){
  const s=e.target.value.trim();
  nodes.forEach(function(n){ if(n.el) n.el.classList.remove("flash"); });
  if(!s) return;
  const hit=nodes.find(function(n){ return n.id.indexOf(s)>=0 || (n.stateLabel&&n.stateLabel.indexOf(s)>=0); });
  if(!hit) return;
  const g=groups.find(function(gr){ return gr.members.some(function(m){ return m.id===hit.id; }); });
  if(g && view==="world") showLocal(g);
  else if(g && view==="local" && !hit.el) showLocal(g);
  if(hit.el){
    hit.el.classList.add("flash");
    showCard(hit);
    setFocus(hit.id);
    tx = wrap.clientWidth/2 - (hit.x+TILE/2)*scale;
    ty = wrap.clientHeight/2 - (hit.y+TILE/2)*scale;
    apply();
  }
});
showOverworld();
</script>
